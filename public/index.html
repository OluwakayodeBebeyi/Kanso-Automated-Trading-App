<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Kanso Consulting | Stock Paper Trader</title><link rel="icon" type="image/png" href="/kanso-icon.png"><link rel="apple-touch-icon" href="/kanso-icon.png">
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#111c2d;--line:#26364d;--text:#edf3fb;--muted:#9babc0;--accent:#55d6be}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% 0,#192b43,var(--bg) 55%);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:1100px;margin:auto;padding:48px 24px}.top,.heading{display:flex;align-items:center;justify-content:space-between;gap:24px}.top{margin-bottom:36px}.brand-logo{display:block;width:min(280px,48vw);height:auto;border-radius:10px}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:4px 0 10px}h2{font-size:1.4rem;margin:0}.eyebrow{color:var(--accent);letter-spacing:.14em;font-size:.72rem;font-weight:750;margin:0 0 8px}.muted{color:var(--muted)}.mode{border:1px solid #267c70;border-radius:999px;padding:8px 13px;color:var(--accent);font-size:.76rem;font-weight:700}.panel{background:#111c2def;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 20px 60px #0003}button{background:var(--accent);border:0;border-radius:9px;color:#09201d;font-weight:750;padding:11px 16px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px}.card{border:1px solid var(--line);background:#0d1726;border-radius:13px;padding:18px;min-height:150px}.card h3{margin:0}.price{font-size:1.65rem;font-weight:700;margin:12px 0 2px}.signal{color:var(--accent);font-weight:750}.error{color:#ff9e9e}footer{color:var(--muted);font-size:.83rem;margin:24px 4px}footer strong{display:block;color:#dce6f3}@media(max-width:600px){.shell{padding:28px 16px}.panel{padding:19px}.brand-logo{width:min(220px,55vw)}}
</style>
<script defer src="/dashboard.js"></script></head>
<body><main class="shell"><header class="top"><img class="brand-logo" src="/kanso-logo.png" alt="Kanso Consulting"><span class="mode">PAPER MODE</span></header>
<section class="panel"><div class="heading"><div><p class="eyebrow">WATCHLIST</p><h2>Market overview</h2></div><button id="refresh" type="button">Refresh</button></div><p id="status" class="muted" role="status">Connecting…</p><div id="cards" class="cards"></div></section>
<footer><strong>Historical and delayed data can differ from executable prices.</strong>Signals are informational only. No orders are placed and results are not guaranteed.</footer></main></body></html>
