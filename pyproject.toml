[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-paper-trader"
version = "0.1.0"
description = "Explainable market analysis and paper trading MVP"
requires-python = ">=3.12"
dependencies = ["yfinance>=0.2.50,<2", "python-dotenv>=1,<2", "pandas>=2.2,<4", "tzdata>=2024.1", "fastapi>=0.115,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.17,<1"]
local = ["streamlit>=1.40,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

